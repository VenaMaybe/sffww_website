# Bootstrap HTTP site. Replace the hostname if using a different domain.
<VirtualHost *:80>
    ServerName sffww.com
    DocumentRoot /var/www/sffww/current
    DirectoryIndex index.html
    Alias /.well-known/acme-challenge/ /var/www/sffww-acme/.well-known/acme-challenge/
    <Directory /var/www/sffww-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/sffww>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/sffww-error.log
    CustomLog ${APACHE_LOG_DIR}/sffww-access.log combined
</VirtualHost>
